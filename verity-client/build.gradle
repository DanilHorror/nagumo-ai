// Клиентский модуль — распространяется игрокам (раздел 3 ТЗ).
// Ревизия 10.09.2026 сделала это устаревшим: личность/промпты и LLM-инференс
// (brain, раздел 6 ТЗ) теперь ОСОЗНАННО здесь — на клиентском железе, ради экономии
// на аренде серверного GPU (компромисс раздела 3 ТЗ: декомпилируемость промптов на
// старте не монетизируемого проекта не стоит платного сервера под инференс).
// Модуль ru.nagumo.verity.client.brain держится изолированным specifically чтобы
// перенос обратно на сервер, если он понадобится, не требовал переписывать остальной
// клиентский код (раздел 3/6 ТЗ).

dependencies {
    implementation project(":verity-common")
    // Общие сетевые классы должны попасть в распространяемый jar (jar-in-jar),
    // иначе на рантайме NoClassDefFoundError (раздел 9 ТЗ).
    include project(":verity-common")

    // Simple Voice Chat (откат 11.09.2026, см. docs/SPEC.md и archive/): голосовой пайплайн
    // теперь целиком серверный (NagumoVoicechatPlugin в verity-server) — ни один
    // класс verity-client не импортирует voicechat-api, поэтому compile-time
    // зависимости здесь НЕТ (задача просила добавить её "если компилятору нужен
    // API-класс" — не нужен). modRuntimeOnly — только чтобы runClient для РУЧНОГО
    // теста реально мог захватывать/проигрывать голос через SVC: без запущенного
    // мода на клиенте некому будет ни отправить микрофон, ни услышать ответ сервера,
    // даже если сама архитектура верна. Игрокам это НЕ добавляет зависимость — soft:
    // fabric.mod.json клиента не перечисляет "voicechat_api"/simple-voice-chat вовсе
    // (ни hard, ни soft depend), т.к. Fabric не требует объявлять зависимость на мод,
    // чьи классы ты не используешь — сам SVC как обычный сторонний мод либо есть у
    // игрока, либо нет, verity-client от этого не падает и не блокируется.
    modRuntimeOnly "maven.modrinth:simple-voice-chat:fabric-${project.voicechat_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
