# ВАЖНО: версии ниже соответствуют актуальным на 08.09.2026 (см. ТЗ, раздел 4).
# Если Gradle не может найти yarn_mappings или fabric_version — проверь актуальные
# значения на https://fabricmc.net/develop/ и поправь здесь.

minecraft_version=26.2
# yarn_mappings больше не используется: для 26.2 в этом окружении нет yarn-маппингов,
# сборка идёт на identity-маппинге (см. build.gradle + mappings/). Оставлено для истории.
yarn_mappings=26.2+build.1
loader_version=0.19.3

fabric_version=0.152.1+26.2

# GeckoLib убран (ревизия 10.09.2026, см. ТЗ) — компаньон больше не
# сущность в мире, geckolib_version больше не используется нигде в build.gradle.

# Simple Voice Chat — ВОССТАНОВЛЕНО (откат 11.09.2026, см. ТЗ и archive/
# server-side-voice-revert-2026-09-10/README.md). Версии перепроверены заново
# 11.09.2026 через Modrinth API (не по памяти) — оказались ТЕ ЖЕ, что стояли до
# удаления: maven-metadata.xml на maven.maxhenkel.de показывает 2.6.20 как
# <latest>/<release> voicechat-api (новее не выходило); Modrinth API отдаёт
# fabric-2.6.23+26.2 как самую свежую версию мода конкретно под Minecraft 26.2
# (кандидаты новее — 2.6.24+ и т.п. — под 26.2 просто не существуют на данный
# момент). Совпадение версий — это переподтверждение, а не переиспользование
# памяти без проверки.
# voicechat_api_version — версия API-артефакта de.maxhenkel.voicechat:voicechat-api
#   (maven.maxhenkel.de). mod id API — "voicechat_api".
# voicechat_version — версия самого мода SVC под MC 26.2 с Modrinth-maven
#   (координата maven.modrinth:simple-voice-chat:fabric-<этой строки>). Нужен для
#   dev-запуска (modRuntimeOnly) на обоих модулях и как жёсткий depends в
#   fabric.mod.json сервера (раздел 5 ТЗ — без него голосовому пайплайну неоткуда
#   брать микрофон).
voicechat_api_version=2.6.20
voicechat_version=2.6.23+26.2

mod_version=0.1.0-SNAPSHOT
maven_group=ru.nagumo
archives_base_name=nagumo-ai

org.gradle.jvmargs=-Xmx2G

# Тулчейн Java 25 (MC 26.2 требует Java 25). В системе нет JDK 25 в стандартных
# местах авто-детекта, поэтому указываем JBR из IntelliJ явно. Поправь путь, если
# у тебя другая версия IDEA / отдельный JDK 25.
org.gradle.java.installations.paths=C:\\Program Files\\JetBrains\\IntelliJ IDEA 2026.1\\jbr

# ВАЖНО: org.gradle.java.installations.paths (выше) говорит Gradle, где искать JDK
# для тулчейна (компиляция кода), но не на чём запускать сам Gradle. Если в PATH
# системы стоит старая Java (например 8-я) — Gradle не запустится вообще ("Gradle
# requires JVM 17 or later"), даже если тулчейн настроен верно. Поэтому явно
# указываем, на какой JVM работает сам Gradle — та же JBR от IntelliJ (Java 25).
org.gradle.java.home=C:\\Program Files\\JetBrains\\IntelliJ IDEA 2026.1\\jbr

# MC 26.2 в этом окружении не имеет ни yarn-, ни Mojang-маппингов (см. SETUP.md,
# точка риска №1): доступен только пустой intermediary, а сам клиентский jar и
# Fabric API уже опубликованы в читаемых именах. Поэтому маппинг = identity
# (mappings/identity-v2.jar), а промежуточные intermediary-маппинги отключены
# (noIntermediateMappings в build.gradle).
#
# Loom пытается ремапить sources-jar Fabric API через Mercury, что падает на
# identity-маппинге ("Cannot remap modifiers ... targets []"). В CI-режиме Loom
# полностью пропускает скачивание и ремап sources — именно это нам и нужно.
systemProp.fabric.loom.ci=true
org.gradle.parallel=true
org.gradle.caching=true
